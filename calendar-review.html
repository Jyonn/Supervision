<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supervision · 日历隔离演示</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="account.css"></head><body><div style="padding:12px 20px;background:#eee9dc;font:12px -apple-system,sans-serif">隔离日历交互演示 · 人物、日历和会议均为虚构 · 所有读写仅内存模拟，不发送邀请或连接外部服务</div><main style="max-width:1180px;margin:auto;padding:24px" id="calendar-review"></main><div id="account-toast" role="status" aria-live="polite"></div><script src="markdown.js"></script><script>
const sessionUser={id:1,name:'林澄（虚构）'},groupItems=[{id:1,name:'虚构研究组'}];let screen='calendar';
function go(value){screen=value}function groupsPage(){message('此页只演示日历；可返回主原型查看研究组')}
function renderAccount(){document.getElementById('calendar-review').innerHTML=calendarPage()}
function message(value){const box=document.getElementById('account-toast');box.textContent=value;box.style.display='block';setTimeout(()=>box.style.display='none',4000)}
const mock={connection:{status:'active',capabilities:['read_busy','write_events'],provider_ready:false},sharing:'busy',members:[{id:1,name:'林澄（虚构）'},{id:2,name:'周予（虚构）'}],meetings:[{id:1,group_id:1,organizer_id:1,title:'检索方向周会 · 虚构',agenda:'## 本次讨论\n- 对照实验结果\n- 下周的样例分析',start:'2026-10-20T09:00:00Z',end:'2026-10-20T09:45:00Z',timezone:'UTC',kind:'weekly',status:'scheduled',revision:1,participant_ids:[1,2],can_edit:true,sync:{status:'pending',external_linked:false,synced_revision:0}}]};
async function api(path,method='GET',body){if(path==='calendar/connection/'){if(method==='POST'){mock.connection.status='revoked';mock.sharing='none'}return {...mock.connection}}if(path.endsWith('calendar/sharing/')){if(method==='PATCH')mock.sharing=body.visibility;return {visibility:mock.sharing,effective:mock.connection.status==='active'}}if(path.endsWith('/members/'))return mock.members;if(path.includes('calendar/availability/'))return {members:mock.members.map((m,i)=>({user_id:m.id,name:m.name,state:i===0&&mock.sharing!=='none'&&mock.connection.status==='active'?'known':'unknown',visibility:'busy',busy:i===0&&mock.sharing!=='none'?[{start:'2026-10-20T09:30:00Z',end:'2026-10-20T10:00:00Z'}]:[]})),complete:false,suggestions:[],unknown_member_ids:[2]};if(path==='groups/1/meetings/'){if(method==='POST')mock.meetings.unshift({...body,id:Math.max(0,...mock.meetings.map(m=>m.id))+1,group_id:1,organizer_id:1,status:'scheduled',revision:1,can_edit:true,sync:{status:'pending',external_linked:false,synced_revision:0}});return mock.meetings}const match=path.match(/^meetings\/(\d+)\/$/);if(match){if(method==='POST')throw Error('真实同步未启用，未创建外部事件');const meeting=mock.meetings.find(m=>m.id===Number(match[1]));if(meeting.revision!==body.revision)throw Error('修订已改变');if(body.action==='cancel')meeting.status='cancelled';else Object.assign(meeting,body);meeting.revision++;return meeting}throw Error('隔离演示不支持此操作')}
</script><script src="calendar.js"></script><script>openCalendar(1);</script></body></html>
