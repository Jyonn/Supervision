# Enable only after API certificate issuance. Do not replace existing sites.
server {
    listen 80;
    server_name api.supervision.qijiong.work;
    location /.well-known/acme-challenge/ { root /var/www/supervision-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.supervision.qijiong.work;
    ssl_certificate /etc/letsencrypt/live/api.supervision.qijiong.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.supervision.qijiong.work/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8051;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Do not log OAuth callback query strings, including failed requests.
        access_log off;
    }
}
