# Compatibility only. Never forward OAuth/PKCE callback query strings cross-origin.
server {
    listen 80;
    server_name api.supervision.qijiong.work;
    location /.well-known/acme-challenge/ { root /var/www/supervision-acme; }
    location / { return 301 https://api.supervision.qijiong.work$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.supervision.qijiong.work;
    ssl_certificate /etc/letsencrypt/live/api.supervision.qijiong.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.supervision.qijiong.work/privkey.pem;
    access_log off;
    error_log /dev/null crit;
    charset utf-8;
    location = /api/auth/friendom/callback/ {
        default_type text/html;
        return 410 '<p>网站已迁移，请回到新网站重新登录。本次授权参数不会转发。</p><a href="https://abandon.qijiong.work/">打开板凳 · Abandon</a>';
    }
    location = /api/calendar/authorization/callback/ {
        default_type text/html;
        return 410 '<p>网站已迁移，请在新网站重新连接日历。本次授权参数不会转发。</p><a href="https://abandon.qijiong.work/">打开板凳 · Abandon</a>';
    }
    location /api/ {
        default_type application/json;
        return 410 '{"error":"网站已迁移，请打开 https://abandon.qijiong.work/ 并重新登录。"}';
    }
    location / { return 302 https://abandon.qijiong.work/; }
}
