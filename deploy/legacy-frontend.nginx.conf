server {
    listen 80;
    server_name supervision.qijiong.work;
    location /.well-known/acme-challenge/ { root /var/www/supervision-acme; }
    location / { return 302 https://abandon.qijiong.work/; }
}
server {
    listen 443 ssl;
    server_name supervision.qijiong.work;
    ssl_certificate /etc/letsencrypt/live/supervision.qijiong.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supervision.qijiong.work/privkey.pem;
    access_log off;
    error_log /dev/null crit;
    location / { return 302 https://abandon.qijiong.work/; }
}
